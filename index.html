/* ══════════════════════════════════════════════════════════════════════════
   BAGIAN 5 — MESIN HITUNG (semua angka turunan dihasilkan di sini)
   ══════════════════════════════════════════════════════════════════════════ */
const Calc = {
  T(y){ return S.tahun[y || S.ta] || tahunKosong(y||S.ta); },
  tahunTersedia(){ return Object.keys(S.tahun).map(Number).sort((a,b)=>a-b); },

  /* ── Profil ── */
  totMhs(y){ const p=this.T(y).profil.mhs; return sum(PRODI.map(x=>p[x.id])); },
  totDosen(y){ const p=this.T(y).profil.dosen; return sum(PRODI.map(x=>p[x.id])); },
  totMhsBaru(y){ const p=this.T(y).profil.mhsBaru||{}; return sum(PRODI.map(x=>p[x.id])); },
  totLulusan(y){ const p=this.T(y).profil.lulusan||{}; return sum(PRODI.map(x=>p[x.id])); },
  rasioDM(y){ const d=this.totDosen(y); return d? +(this.totMhs(y)/d).toFixed(1) : 0; },

  /* ── Pendapatan ── */
  pendapatanTot(y){ return sum(this.T(y).pendapatan.map(r=>r.pagu)); },
  pendapatanReal(y){ return sum(this.T(y).pendapatan.map(r=>r.real)); },
  pendapatanPerSumber(y){
    const o={}; SUMBER.forEach(s=>o[s.id]={pagu:0,real:0});
    this.T(y).pendapatan.forEach(r=>{ if(!o[r.sumber]) o[r.sumber]={pagu:0,real:0}; o[r.sumber].pagu+=num(r.pagu); o[r.sumber].real+=num(r.real); });
    return o;
  },

  /* ── POK ── */
  pokTotal(y){ return sum(this.T(y).pok.map(k=>k.p)); },
  pokRealisasi(y){ let t=0; this.T(y).pok.forEach(k=>k.sub.forEach(s=>{ t += sum(s.rz||[]); })); return t; },
  pokRealisasiTW(y){ const tw=[0,0,0,0]; this.T(y).pok.forEach(k=>k.sub.forEach(s=>{ (s.rz||[]).forEach((v,i)=>tw[i]+=num(v)); })); return tw; },
  subKey(k,s){ return k+'.'+s; },
  allSub(y){ const out=[]; this.T(y).pok.forEach(k=>k.sub.forEach(s=>out.push({komp:k,sub:s,key:k.k+'.'+s.k}))); return out; },

  /* Pagu per bidang — hanya dari pagu kelola fakultas (POK) */
  /* Golongan satu sub-kegiatan: pagu kelola fakultas atau dana alokasi terpusat */
  subKel(s){ return s && s.kel==='terpusat' ? 'terpusat' : 'fakultas'; },
  subPos(s){ return (s && POS_MAP[s.pos]) ? s.pos : subPosBaku(s); },
  /* Rekapitulasi POK menurut pos penggunaan dan golongannya */
  posPok(y){
    const o={}; POS_PUSAT.forEach(p=>o[p.id]={fak:0, ter:0});
    this.T(y).pok.forEach(k=>k.sub.forEach(s=>{
      const pos=this.subPos(s); if(!o[pos]) o[pos]={fak:0,ter:0};
      o[pos][this.subKel(s)==='terpusat'?'ter':'fak'] += num(s.p);
    }));
    return o;
  },
  /* Pagu per bidang yang benar-benar dikelola fakultas */
  paguBidangPOK(y){
    const o={}; BIDANG.forEach(b=>o[b.id]=0);
    this.T(y).pok.forEach(k=>k.sub.forEach(s=>{
      if(this.subKel(s)==='fakultas') o[s.bid] = (o[s.bid]||0) + num(s.p);
    }));
    return o;
  },
  /* Porsi POK yang digolongkan sebagai dana alokasi terpusat */
  paguBidangPokTerpusat(y){
    const o={}; BIDANG.forEach(b=>o[b.id]=0);
    this.T(y).pok.forEach(k=>k.sub.forEach(s=>{
      if(this.subKel(s)==='terpusat') o[s.bid] = (o[s.bid]||0) + num(s.p);
    }));
    return o;
  },
  paguKelolaTot(y){ let t=0; this.T(y).pok.forEach(k=>k.sub.forEach(s=>{ if(this.subKel(s)==='fakultas') t+=num(s.p); })); return t; },
  pokTerpusatTot(y){ let t=0; this.T(y).pok.forEach(k=>k.sub.forEach(s=>{ if(this.subKel(s)==='terpusat') t+=num(s.p); })); return t; },
  realBidangPOK(y){
    const o={}; BIDANG.forEach(b=>o[b.id]=0);
    this.T(y).pok.forEach(k=>k.sub.forEach(s=>{ o[s.bid] = (o[s.bid]||0) + sum(s.rz||[]); }));
    return o;
  },
  /* Pagu per bidang gabungan: POK fakultas + alokasi terpusat (universitas) */
  paguBidangTotal(y){
    const a=this.paguBidangPOK(y), e=this.paguBidangPusat(y), o={};
    BIDANG.forEach(b=> o[b.id] = num(a[b.id]) + num(e[b.id]) );
    return o;
  },
  grandTotal(y){ const t=this.paguBidangTotal(y); return sum(BIDANG.map(b=>t[b.id])); },

  /* ── Dana alokasi terpusat ── */
  P(y){ const t=this.T(y); if(!t.pusat) t.pusat={basis:basisPusatAwal(), pos:{}};
    if(!t.pusat.basis) t.pusat.basis=basisPusatAwal();
    if(!t.pusat.pos) t.pusat.pos={};
    POS_PUSAT.forEach(p=>{ if(!t.pusat.pos[p.id]) t.pusat.pos[p.id]={v:0,mode:'manual',univ:0,dasar:p.dasar,ket:''}; });
    return t.pusat; },
  /* Porsi fakultas terhadap universitas menurut dasar perimbangan */
  porsiPusat(y, dasar){
    const b=this.P(y).basis, t=this.T(y);
    const mhsF = num(b.mhsFebi)>0? num(b.mhsFebi) : this.totMhs(y);
    const dsnF = num(b.dsnFebi)>0? num(b.dsnFebi) : this.totDosen(y);
    switch(dasar){
      case 'unit':  return num(b.unitUniv)>0 ? 1/num(b.unitUniv) : 0;
      case 'prodi': return num(b.prodiUniv)>0 ? num(b.prodiFebi)/num(b.prodiUniv) : 0;
      case 'mhs':   return num(b.mhsUniv)>0 ? mhsF/num(b.mhsUniv) : 0;
      case 'dsn':   return num(b.dsnUniv)>0 ? dsnF/num(b.dsnUniv) : 0;
      default: return 0;
    }
  },
  /* Nilai satu pos: ditetapkan langsung, atau diturunkan dari anggaran universitas */
  pusatPos(y, id){
    const r=this.P(y).pos[id]; if(!r) return 0;
    if(r.mode==='turunan'){
      const ps=this.porsiPusat(y, r.dasar||POS_MAP[id].dasar);
      return Math.round(num(r.univ)*ps);
    }
    return Math.max(0, num(r.v));
  },
  pusatSemua(y){ const o={}; POS_PUSAT.forEach(p=>o[p.id]=this.pusatPos(y,p.id)); return o; },
  /* Nilai satu pos secara menyeluruh: bagian luar POK ditambah porsi POK yang digolongkan terpusat */
  pusatPosPenuh(y,id){ return this.pusatPos(y,id) + num((this.posPok(y)[id]||{}).ter); },
  pusatPenuh(y){ const pp=this.posPok(y), o={};
    POS_PUSAT.forEach(p=>o[p.id]=this.pusatPos(y,p.id)+num((pp[p.id]||{}).ter)); return o; },
  pusatLuarTot(y){ return sum(POS_PUSAT.map(p=>this.pusatPos(y,p.id))); },
  pusatTot(y){ return this.pusatLuarTot(y) + this.pokTerpusatTot(y); },
  pusatGrp(y){ const o={}; POS_GRP.forEach(g=>o[g.id]=0); const pn=this.pusatPenuh(y);
    POS_PUSAT.forEach(p=>{ o[p.grp]+=num(pn[p.id]); }); return o; },
  paguBidangPusat(y){ const o={}; BIDANG.forEach(b=>o[b.id]=0);
    POS_PUSAT.forEach(p=>{ o[p.bid]+=this.pusatPos(y,p.id); });
    const pt=this.paguBidangPokTerpusat(y);
    BIDANG.forEach(b=>{ o[b.id]+=num(pt[b.id]); });
    return o; },
  eksternalTot(y){ return this.pusatTot(y); },
  /* Total anggaran universitas yang tercatat pada pos bermode turunan */
  /* Seluruh angka anggaran universitas yang tercatat, baik pos itu sedang
     dihitung sebagai turunan maupun masih memakai nilai yang ditetapkan. */
  univTot(y){ const P=this.P(y); return sum(POS_PUSAT.map(p=> num(P.pos[p.id].univ))); },
  univTurunan(y){ const P=this.P(y); return sum(POS_PUSAT.map(p=> P.pos[p.id].mode==='turunan'? num(P.pos[p.id].univ) : 0)); },
  posTurunan(y){ const P=this.P(y); return POS_PUSAT.filter(p=>P.pos[p.id].mode==='turunan').length; },

  /* ── Bobot & distribusi prodi ── */
  bobot(y, basis){
    const t=this.T(y), o={};
    const mTot=this.totMhs(y)||1, dTot=this.totDosen(y)||1;
    PRODI.forEach(p=>{
      const m = num(t.profil.mhs[p.id])/mTot, d = num(t.profil.dosen[p.id])/dTot;
      o[p.id] = basis==='dsn' ? d : basis==='mhs' ? m : (m+d)/2;
    });
    const s = sum(PRODI.map(p=>o[p.id])) || 1;
    PRODI.forEach(p=> o[p.id] = o[p.id]/s*100 );
    return o;
  },
  basisBidang(y,bid){
    const d=this.T(y).distribusi;
    if(d.basis && d.basis[bid]) return d.basis[bid];
    const def={pdd:'mhs',kmh:'mhs',pnl:'dsn',pkm:'dsn',sdm:'dsn',srp:'mhs',tkl:'mix'};
    return def[bid]||'mix';
  },
  bobotBidang(y,bid){
    const b=this.basisBidang(y,bid), t=this.T(y);
    if(b==='manual'){
      const m=(t.distribusi.manual||{})[bid];
      const s=m? sum(PRODI.map(p=>num(m[p.id]))) : 0;
      if(m && s>0){ const o={}; PRODI.forEach(p=>o[p.id]=num(m[p.id])/s*100); return o; }
      return this.bobot(y,'mhs');
    }
    return this.bobot(y,b);
  },
  /* Matriks distribusi: {bidang: {prodiId: nominal}} */
  matriks(y){
    const pag=this.paguBidangTotal(y), M={};
    BIDANG.forEach(b=>{
      const w=this.bobotBidang(y,b.id); M[b.id]={};
      let acc=0;
      PRODI.forEach((p,i)=>{
        let v;
        if(i===PRODI.length-1) v = num(pag[b.id]) - acc;           // baris terakhir menyerap pembulatan
        else { v = Math.round(num(pag[b.id])*w[p.id]/100); acc += v; }
        M[b.id][p.id]=v;
      });
    });
    return M;
  },
  totalProdi(y){
    const M=this.matriks(y), o={};
    PRODI.forEach(p=> o[p.id] = sum(BIDANG.map(b=>M[b.id][p.id])) );
    return o;
  },
  /* Matriks realisasi POK terdistribusi (proporsional atas bobot bidang) */
  matriksReal(y){
    const rz=this.realBidangPOK(y), M={};
    BIDANG.forEach(b=>{ const w=this.bobotBidang(y,b.id); M[b.id]={};
      let acc=0; PRODI.forEach((p,i)=>{ let v; if(i===PRODI.length-1) v=num(rz[b.id])-acc; else {v=Math.round(num(rz[b.id])*w[p.id]/100); acc+=v;} M[b.id][p.id]=v; }); });
    return M;
  },

  /* ── Kecukupan dana (DOP / DPD / DPkM) ── */
  skor(v, ideal, minim){
    v=num(v); ideal=num(ideal)||1; minim=num(minim)||ideal/2;
    if(v>=ideal) return 4;
    if(v>=minim) return +(2 + 2*(v-minim)/Math.max(ideal-minim,1e-9)).toFixed(2);
    return +(2*v/Math.max(minim,1e-9)).toFixed(2);
  },
  kecukupan(y){
    const pag=this.paguBidangTotal(y), M=this.matriks(y), t=this.T(y), A=S.ambang;
    const mhsT=this.totMhs(y)||1, dsnT=this.totDosen(y)||1;
    /* DOP mencakup pendidikan + kemahasiswaan + operasional tak langsung (sarpras dianggap investasi) */
    const opFak = num(pag.pdd)+num(pag.kmh)+num(pag.tkl);
    const out = {fakultas:{
      dop:+((opFak/mhsT)/1e6).toFixed(3),
      dpd:+((num(pag.pnl)/dsnT)/1e6).toFixed(3),
      dpkm:+((num(pag.pkm)/dsnT)/1e6).toFixed(3)
    }, prodi:{}};
    PRODI.forEach(p=>{
      const m=num(t.profil.mhs[p.id])||1, d=num(t.profil.dosen[p.id])||1;
      const op = num(M.pdd[p.id])+num(M.kmh[p.id])+num(M.tkl[p.id]);
      out.prodi[p.id]={
        dop:+((op/m)/1e6).toFixed(3),
        dpd:+((num(M.pnl[p.id])/d)/1e6).toFixed(3),
        dpkm:+((num(M.pkm[p.id])/d)/1e6).toFixed(3)
      };
    });
    const addSkor = o => { o.sDop=this.skor(o.dop,A.dop.ideal,A.dop.minim); o.sDpd=this.skor(o.dpd,A.dpd.ideal,A.dpd.minim); o.sDpkm=this.skor(o.dpkm,A.dpkm.ideal,A.dpkm.minim); o.sRata=+(((o.sDop+o.sDpd+o.sDpkm)/3).toFixed(2)); };
    addSkor(out.fakultas); PRODI.forEach(p=>addSkor(out.prodi[p.id]));
    return out;
  },

  /* ── Evaluasi otomatis ── */
  nilaiOtomatis(y, kode){
    const pag=this.paguBidangTotal(y), pokP=this.paguBidangPOK(y), rz=this.realBidangPOK(y);
    const G=this.grandTotal(y)||1, K=this.kecukupan(y);
    switch(kode){
      case 'dop': return K.fakultas.dop;
      case 'dpd': return K.fakultas.dpd;
      case 'dpkm':return K.fakultas.dpkm;
      case 'serap_pdd': return pct(rz.pdd, pokP.pdd);
      case 'serap_kmh': return pct(rz.kmh, pokP.kmh);
      case 'serap_tot': return pct(this.pokRealisasi(y), this.pokTotal(y));
      case 'ratio_pnl': return pct(pag.pnl, G);
      case 'ratio_pkm': return pct(pag.pkm, G);
      case 'ratio_sdm': return pct(pag.sdm, G);
      case 'ratio_srp': return pct(pag.srp, G);
      case 'ratio_pdd': return pct(pag.pdd, G);
      case 'dev_prodi': {
        const tot=this.totalProdi(y), G2=sum(PRODI.map(p=>tot[p.id]))||1, wm=this.bobot(y,'mhs');
        return +(Math.max.apply(null, PRODI.map(p=> Math.abs(pct(tot[p.id],G2) - wm[p.id]) ))).toFixed(2);
      }
      default: return 0;
    }
  },
  capaianEval(y,e){ return e.auto ? this.nilaiOtomatis(y,e.auto) : num(e.capaian); },
  statusEval(y,e){
    const c=this.capaianEval(y,e), t=num(e.target)||0;
    const r = e.arah==='min' ? (c<=t) : (c>=t);
    const ratio = e.arah==='min' ? (c<=t?100:Math.max(0,100-(c-t)/Math.max(t,1e-9)*100)) : pct(c,t);
    if(r) return {s:'Tercapai', cls:'chip-g', r:Math.min(ratio,999)};
    if(ratio>=85) return {s:'Hampir', cls:'chip-y', r:ratio};
    if(ratio>=60) return {s:'Kurang', cls:'chip-y', r:ratio};
    return {s:'Belum', cls:'chip-r', r:ratio};
  },

  /* ── Tabel 6 LAMEMBA (dihitung ulang & benar) ── */
  /* Banyaknya kolom tahun yang benar-benar terisi (2 bila TS-2 masih kosong) */
  t6nT(){ return S.t6.rows.some(r=>num(r.v0)!==0) ? 3 : 2; },
  t6Tahun(){ return [num(S.t6.y0), num(S.t6.y1), num(S.t6.y2)]; },
  /* Pemetaan baris Tabel 6 ke bidang alokasi — dasar bobot otomatis per prodi */
  t6Bid(id){
    const m={p_pem:'tkl',p_mhs:'tkl',p_prf:'tkl',p_lai:'tkl',
      b_dsn:'pdd',b_tdk:'pdd',b_opb:'pdd',b_otl:'pdd',b_kmh:'kmh',
      b_pnl:'pnl',b_pkm:'pkm',i_sdm:'sdm',i_sar:'srp',i_pra:'srp'};
    return m[id]||'mix';
  },
  /* Bobot prodi untuk satu baris: pakai penyesuaian manual bila ada, jika tidak
     turunkan dari mesin distribusi bidang pada tahun TS. */
  t6Bobot(id){
    const ov=(S.t6.w||{})[id];
    if(ov){ const s=sum(PRODI.map(p=>num(ov[p.id])));
      if(s>0){ const o={}; PRODI.forEach(p=>o[p.id]=num(ov[p.id])/s*100); return o; } }
    return this.bobotBidang(num(S.t6.y2), this.t6Bid(id));
  },
  t6(){
    const T=S.t6, R={}, nT=this.t6nT(), g={pendapatan:[0,0,0],operasional:[0,0,0],litabmas:[0,0,0],investasi:[0,0,0]};
    T.rows.forEach(r=>{
      const u=[num(r.v0),num(r.v1),num(r.v2)];
      R[r.id]={v0:u[0], v1:u[1], v2:u[2], u:u, rata:(u[0]+u[1]+u[2])/nT};
      if(g[r.grp]){ g[r.grp][0]+=u[0]; g[r.grp][1]+=u[1]; g[r.grp][2]+=u[2]; }
    });
    const J={}; Object.keys(g).forEach(k=> J[k]={v0:g[k][0], v1:g[k][1], v2:g[k][2], u:g[k].slice(), rata:(g[k][0]+g[k][1]+g[k][2])/nT} );
    return {baris:R, jumlah:J, nT:nT, tahun:this.t6Tahun()};
  },

  /* ── Matriks lengkap 15 kolom sesuai instrumen LAMEMBA ──
     Untuk setiap baris menghasilkan: nilai UPPS 3 tahun + rata-rata,
     nilai prodi terakreditasi 3 tahun + rata-rata, persentase prodi
     terakreditasi, dan persentase prodi lain di UPPS.                       */
  t6Full(pid){
    pid = pid || S.t6.psAkr || PRODI[0].id;
    const T=S.t6, nT=this.t6nT(), c=this.t6();
    const G={pendapatan:null,operasional:null,litabmas:null,investasi:null};
    const kosong=()=>({u:[0,0,0], ps:[0,0,0]});
    Object.keys(G).forEach(k=>G[k]=kosong());
    const B={};
    T.rows.forEach(r=>{
      const u=c.baris[r.id].u;
      const mode=(T.mode||{})[r.id]==='manual' ? 'manual':'auto';
      const w=this.t6Bobot(r.id);
      let ps;
      if(mode==='manual'){
        const m=((T.man||{})[r.id]||{})[pid]||[0,0,0];
        ps=[0,1,2].map(i=>Math.min(num(m[i]), u[i]));
      } else {
        ps=u.map(v=>Math.round(v*num(w[pid])/100));
      }
      const lain=[0,1,2].map(i=>u[i]-ps[i]);
      B[r.id]={
        u:u, uRata:(u[0]+u[1]+u[2])/nT,
        ps:ps, psRata:(ps[0]+ps[1]+ps[2])/nT,
        lain:lain, lainRata:(lain[0]+lain[1]+lain[2])/nT,
        pctPs:[0,1,2].map(i=> u[i]? ps[i]/u[i]*100 : 0),
        pctLain:[0,1,2].map(i=> u[i]? lain[i]/u[i]*100 : 0),
        w:num(w[pid]), mode:mode, bobot:w
      };
      if(G[r.grp]){ [0,1,2].forEach(i=>{ G[r.grp].u[i]+=u[i]; G[r.grp].ps[i]+=ps[i]; }); }
    });
    const J={};
    Object.keys(G).forEach(k=>{
      const u=G[k].u, ps=G[k].ps, lain=[0,1,2].map(i=>u[i]-ps[i]);
      J[k]={u:u, uRata:(u[0]+u[1]+u[2])/nT, ps:ps, psRata:(ps[0]+ps[1]+ps[2])/nT,
            lain:lain, lainRata:(lain[0]+lain[1]+lain[2])/nT,
            pctPs:[0,1,2].map(i=> u[i]? ps[i]/u[i]*100 : 0),
            pctLain:[0,1,2].map(i=> u[i]? lain[i]/u[i]*100 : 0)};
    });
    return {baris:B, jumlah:J, nT:nT, pid:pid, tahun:this.t6Tahun()};
  },
  /* Distribusi Tabel 6 ke masing-masing prodi (persentase memakai bobot yang berlaku) */
  t6Prodi(prodiId){
    const t6=this.t6(), y2=S.t6.y2;
    const bidOf = {p_pem:'tkl',p_mhs:'tkl',p_prf:'tkl',p_lai:'tkl',
      b_dsn:'pdd',b_tdk:'pdd',b_opb:'pdd',b_otl:'pdd',b_kmh:'kmh',
      b_pnl:'pnl',b_pkm:'pkm',i_sdm:'sdm',i_sar:'srp',i_pra:'srp'};
    const out={};
    S.t6.rows.forEach(r=>{
      const w=this.bobotBidang(y2, bidOf[r.id]||'mix')[prodiId]/100;
      out[r.id]={v1:num(r.v1)*w, v2:num(r.v2)*w, rata:(num(r.v1)+num(r.v2))/2*w, w:w*100};
    });
    return out;
  },

  /* Tarik nilai Unit Pengelola pada satu kolom tahun Tabel 6 dari data dasbor.
     Hanya baris yang benar-benar berpadanan dengan bidang alokasi yang diisi,
     agar setiap angka tetap dapat ditelusuri asal-usulnya.                    */
  t6Tarik(kol, y){
    const f = ['v0','v1','v2'][kol]; if(!f) return {isi:0, lewat:[], y:y};
    if(!S.tahun[y]) return {isi:0, lewat:[], y:y, kosong:true};
    const t=this.T(y);
    /* Pendapatan menurut sumbernya */
    const perSumber={}; SUMBER.forEach(s=>perSumber[s.id]=0);
    (t.pendapatan||[]).forEach(r=>{ perSumber[r.sumber]=(perSumber[r.sumber]||0)+num(r.nilai!=null?r.nilai:r.pagu); });
    /* Penggunaan: pagu kelola dari POK ditambah dana alokasi terpusat, pos demi pos.
       Porsi POK pada satu bidang dibebankan ke pos pertama bidang tersebut, sebab
       rincian POK tidak memisahkan lebih jauh dari itu. */
    const pp=this.posPok(y), pus=this.pusatSemua(y);
    const peta={ p_pem:perSumber.rm, p_mhs:perSumber.pnbp, p_prf:perSumber.kso, p_lai:perSumber.lain };
    POS_PUSAT.forEach(ps=>{
      peta[ps.id] = num(pus[ps.id]) + num((pp[ps.id]||{}).fak) + num((pp[ps.id]||{}).ter);
    });
    let isi=0;
    S.t6.rows.forEach(r=>{ if(peta[r.id]!=null){ r[f]=Math.max(0, Math.round(peta[r.id])); isi++; } });
    const lewat = S.t6.rows.filter(r=>peta[r.id]==null).map(r=>r.label);
    return {isi:isi, lewat:lewat, y:y};
  },
  /* Perbandingan sarana terhadap prasarana dipertahankan dari isian yang ada */
  t6BagiSrp(){
    const a=num((S.t6.rows.find(r=>r.id==='i_sar')||{}).v2), b=num((S.t6.rows.find(r=>r.id==='i_pra')||{}).v2);
    return (a+b)>0 ? a/(a+b) : 0.5;
  },

  /* Selisih terhadap berkas isian asal.
     Selisih pada kolom tahun berlaku selamanya; selisih pada kolom rata-rata
     hanya bermakna selama data masih berbentuk dua tahun seperti berkas asal,
     sebab begitu kolom TS-2 terisi nilai rata-rata pada berkas menjadi usang. */
  t6Beda(){
    const c=this.t6(), a=S.t6.asli, out=[], nT=this.t6nT();
    const cek=(kode,nm,hit,asl,jenis)=>{ if(asl!=null && Math.abs(hit-asl)>1) out.push({kode,nm,hit,asl,jenis}); };
    cek('T6-J2','Jumlah Biaya Operasional — '+S.t6.y2, c.jumlah.operasional.v2, a.jml_operasional[1], 'tahun');
    cek('T6-J5','Jumlah Investasi — '+S.t6.y2, c.jumlah.investasi.v2, a.jml_investasi[1], 'tahun');
    if(nT<3){
      cek('T6-J1','Jumlah Pendapatan — rata-rata', c.jumlah.pendapatan.rata, a.jml_pendapatan[2], 'rata');
      cek('T6-J3','Jumlah Biaya Operasional — rata-rata', c.jumlah.operasional.rata, a.jml_operasional[2], 'rata');
      cek('T6-J4','Jumlah Penelitian dan PkM — rata-rata', c.jumlah.litabmas.rata, a.jml_litabmas[2], 'rata');
      cek('T6-J6','Jumlah Investasi — rata-rata', c.jumlah.investasi.rata, a.jml_investasi[2], 'rata');
      S.t6.rows.forEach((r,i)=>{ if(a.rata[r.id]!=null)
        cek('T6-R'+(i+1),'Rata-rata baris: '+r.label.slice(0,46), c.baris[r.id].rata, num(a.rata[r.id]), 'rata'); });
    }
    return out;
  },
  /* Benar tidaknya nilai rata-rata pada berkas asal sudah tak dapat dibandingkan
     lagi setelah kolom TS-2 dilengkapi. */
  t6RataUsang(){ return this.t6nT()>=3 && Object.keys(S.t6.asli.rata||{}).length>0; },

  /* ── Audit otomatis ── */
  audit(){
    const F=[], y=S.ta, t=this.T(y);
    const push=(lvl,kode,judul,uraian,rek)=>F.push({lvl,kode,judul,uraian,rek});

    /* A. Integritas pagu POK */
    t.pok.forEach(k=>{
      const sSub=sum(k.sub.map(s=>s.p));
      if(Math.abs(sSub-num(k.p))>0) push('mayor','POK-01','Pagu komponen tidak sama dengan jumlah sub-kegiatan',
        'Komponen '+k.k+' — '+k.n+': pagu '+rp(k.p)+', jumlah sub-kegiatan '+rp(sSub)+' (selisih '+rp(sSub-num(k.p))+').',
        'Telusuri kembali rincian POK dan lakukan revisi agar pagu komponen sama dengan jumlah sub-kegiatannya.');
      k.sub.forEach(s=>{
        const sAk=sum(s.ak.map(a=>a.p));
        if(Math.abs(sAk-num(s.p))>0) push('mayor','POK-02','Pagu sub-kegiatan tidak sama dengan jumlah akun belanja',
          k.k+'.'+s.k+' — '+s.n+': pagu '+rp(s.p)+' vs jumlah akun '+rp(sAk)+'.','Sesuaikan rincian akun belanja pada dokumen POK.');
        s.ak.forEach(a=>{
          const sIt=sum(a.it.map(i=>i.j));
          if(Math.abs(sIt-num(a.p))>0) push('minor','POK-03','Pagu akun tidak sama dengan jumlah butir rincian',
            k.k+'.'+s.k+' akun '+a.k+': pagu '+rp(a.p)+' vs jumlah butir '+rp(sIt)+'.','Periksa volume dan harga satuan pada butir rincian.');
        });
        const rzt=sum(s.rz||[]);
        if(rzt>num(s.p)) push('mayor','RLS-01','Realisasi melampaui pagu',
          k.k+'.'+s.k+' — '+s.n+': realisasi '+rp(rzt)+' melampaui pagu '+rp(s.p)+' sebesar '+rp(rzt-num(s.p))+'.',
          'Lakukan koreksi pencatatan atau ajukan revisi anggaran sesuai ketentuan.');
      });
    });

    /* B. Bidang tanpa alokasi */
    const pokP=this.paguBidangPOK(y), tot=this.paguBidangTotal(y);
    BIDANG.forEach(b=>{
      if(num(pokP[b.id])===0 && num(tot[b.id])===0)
        push('mayor','ALK-01','Bidang tanpa alokasi anggaran',
          'Bidang "'+b.nama+'" tidak memperoleh alokasi pada TA '+y+', baik pada pagu kelola fakultas maupun alokasi terpusat.',
          'Usulkan mata anggaran bidang '+b.pendek+' pada revisi POK/RKAKL tahun berjalan atau tahun berikutnya.');
      else if(num(pokP[b.id])===0 && num(tot[b.id])>0)
        push('observasi','ALK-02','Bidang dibiayai sepenuhnya dari luar pagu kelola fakultas',
          'Bidang "'+b.nama+'" bernilai '+rp(tot[b.id])+' seluruhnya bersumber dari alokasi terpusat; fakultas tidak memiliki kendali langsung atas pelaksanaannya.',
          'Dokumentasikan mekanisme koordinasi dengan pengelola pusat dan usulkan porsi kelola fakultas.');
    });

    /* C. Kecukupan dana */
    const K=this.kecukupan(y), A=S.ambang;
    [['dop','dop','Dana Operasional Pendidikan per mahasiswa'],
     ['dpd','dpd','Dana Penelitian per dosen tetap'],
     ['dpkm','dpkm','Dana PkM per dosen tetap']].forEach(([k,ak,nm])=>{
      const v=K.fakultas[k], amb=A[ak];
      if(v < num(amb.minim))
        push('mayor','KCK-01', nm+' di bawah ambang minimum',
          'Nilai '+amb.kode+' tingkat fakultas '+jt(v*1e6)+' juta/tahun, di bawah ambang minimum '+amb.minim+' juta. Skor indikatif '+this.skor(v,amb.ideal,amb.minim)+' dari 4.',
          'Tingkatkan alokasi pada bidang terkait dan/atau himpun sumber pendanaan eksternal (hibah, kerja sama).');
      else if(v < num(amb.ideal))
        push('minor','KCK-02', nm+' belum mencapai nilai ideal',
          'Nilai '+amb.kode+' '+jt(v*1e6)+' juta/tahun, di bawah nilai ideal '+amb.ideal+' juta. Skor indikatif '+this.skor(v,amb.ideal,amb.minim)+' dari 4.',
          'Susun peta jalan penambahan alokasi bertahap untuk mencapai skor 4 dalam dua tahun anggaran.');
      PRODI.forEach(p=>{
        if(K.prodi[p.id][k] < num(amb.minim))
          push('minor','KCK-03', nm+' pada prodi di bawah ambang',
            'Program Studi '+p.nama+': '+amb.kode+' '+jt(K.prodi[p.id][k]*1e6)+' juta/tahun (ambang '+amb.minim+' juta).',
            'Tinjau kembali bobot distribusi anggaran untuk Program Studi '+p.singkat+'.');
      });
    });

    /* D. Keselarasan Tabel 6 dengan berkas asal */
    const c=this.t6(), a=S.t6.asli, nT=this.t6nT();

    /* D1. Kolom TS-2 belum terisi — akar seluruh selisih rata-rata */
    if(nT<3){
      push('mayor','T6-00','Kolom TS-2 pada Tabel 6 belum terisi',
        'Instrumen menuntut tiga kolom tahun, yaitu TS-2, TS-1, dan TS, beserta rata-ratanya. Berkas isian asal hanya memuat dua tahun, '+
        S.t6.y1+' dan '+S.t6.y2+'; baris penomoran kolom pada berkas bahkan berbunyi 0, 1, 3, 4, 5, dan seterusnya sehingga kolom ke-2 memang hilang. '+
        'Akibatnya sebagian baris rata-rata pada berkas dibagi tiga dan sebagian lain dibagi dua, dan seluruh selisih rata-rata bersumber dari sini.',
        'Lengkapi kolom TS-2 ('+S.t6.y0+') pada laman Tabel 6. Setelah terisi, seluruh rata-rata otomatis dihitung atas tiga tahun sesuai ketentuan instrumen.');
    }

    /* D2. Satuan penyajian */
    if(S.t6.satuan!=='juta')
      push('minor','T6-03','Satuan penyajian belum mengikuti instrumen',
        'Penjelasan kolom 2 sampai 9 pada instrumen menyatakan nilai disajikan dalam juta rupiah, sedangkan penyajian saat ini memakai rupiah penuh.',
        'Ubah satuan menjadi juta rupiah pada laman Tabel 6 sebelum berkas diserahkan.');

    /* D3. Kolom program studi dan persentase */
    const Fp=this.t6Full(S.t6.psAkr);
    if(!Fp.jumlah.pendapatan.ps[2] && !Fp.jumlah.operasional.ps[2])
      push('mayor','T6-04','Kolom program studi yang diakreditasi masih kosong',
        'Kolom 6 sampai 15 instrumen menuntut nilai dan persentase bagi program studi yang diakreditasi serta program studi lain di UPPS. Pada berkas isian asal seluruh kolom tersebut kosong.',
        'Tetapkan program studi yang diakreditasi dan dasar pembagiannya pada laman Tabel 6 agar kolom 6 sampai 15 terisi otomatis dan dapat ditelusuri.');

    /* D4. Selisih terhadap berkas asal */
    const beda=this.t6Beda();
    beda.forEach(b=> push('mayor', b.kode, 'Selisih perhitungan pada berkas isian asal',
      b.nm+': nilai pada berkas '+rp(b.asl)+', hasil hitung ulang '+rp(b.hit)+' (selisih '+rp(b.hit-b.asl)+').',
      nT<3 ? 'Lengkapi kolom TS-2 lalu gunakan angka hasil hitung ulang sistem pada dokumen akreditasi.'
           : 'Gunakan angka hasil hitung ulang sistem pada dokumen akreditasi.'));
    if(this.t6RataUsang())
      push('observasi','T6-06','Nilai rata-rata pada berkas isian asal sudah tidak berlaku',
        'Kolom TS-2 telah dilengkapi sehingga rata-rata kini dihitung atas tiga tahun sesuai ketentuan instrumen. Seluruh nilai rata-rata yang tertulis pada berkas '+
        'isian asal disusun ketika hanya dua tahun terisi, sehingga tidak lagi dapat dijadikan pembanding.',
        'Gunakan angka rata-rata hasil hitung ulang sistem, dan perbarui berkas isian dengan mengunduh Tabel 6 dari laman ini.');
    if(!beda.length)
      push('observasi','T6-05','Seluruh angka Tabel 6 konsisten',
        'Tidak terdapat selisih antara berkas isian asal dan hasil hitung ulang sistem atas '+nT+' kolom tahun.',
        'Pertahankan penyusunan Tabel 6 melalui sistem agar konsistensi terjaga.');

    /* E1. Rekonsiliasi bidang alokasi terhadap Tabel 6 */
    if(y===S.t6.y2 || y===S.t6.y1){
      const kol = y===S.t6.y2 ? 'v2' : 'v1';
      const c6=this.t6();
      let selisihTot=0;
      Object.keys(T6_BIDANG).forEach(bid=>{
        const ids=T6_BIDANG[bid]; if(!ids.length) return;
        const t6v = sum(ids.map(i=>c6.baris[i][kol]));
        const dash = num(tot[bid]);
        const d = dash - t6v; selisihTot += Math.abs(d);
        if(Math.abs(d) > 1000)
          push('minor','REK-01','Alokasi bidang tidak rekonsiliasi dengan Tabel 6',
            'Bidang '+BID_MAP[bid].pendek+': total pada dasbor '+rp(dash)+', nilai padanan pada Tabel 6 '+rp(t6v)+' (selisih '+rp(d)+').',
            'Sesuaikan kolom Dikelola Terpusat pada laman Alokasi per Bidang, atau perbaiki nilai Tabel 6, sehingga kedua sumber angka konsisten.');
      });
      if(selisihTot<=1000)
        push('observasi','REK-02','Alokasi bidang rekonsiliasi penuh dengan Tabel 6',
          'Seluruh bidang alokasi pada dasbor bernilai sama dengan baris padanannya pada Tabel 6 profil keuangan TA '+y+'. '+
          'Sejak dana alokasi terpusat disusun per pos penggunaan, pemadanan berlangsung satu lawan satu untuk kesepuluh pos.',
          'Pertahankan mekanisme satu pintu ini agar angka dasbor dan dokumen akreditasi tidak pernah berselisih.');
    }

    /* E1b. Ketertelusuran dana alokasi terpusat */
    const PP=this.P(y), pusTot=this.pusatTot(y);
    if(!pusTot)
      push('mayor','DAT-01','Dana alokasi terpusat belum diisi',
        'Seluruh pos dana alokasi terpusat TA '+y+' bernilai nol, sehingga biaya yang dibelanjakan universitas untuk kepentingan fakultas tidak tercatat. '+
        'Akibatnya rasio kecukupan dana dan Tabel 6 hanya memuat pagu kelola fakultas.',
        'Isi kesepuluh pos pada laman Dana Alokasi Terpusat, baik dengan angka dari dokumen anggaran universitas maupun dengan turunan perimbangan proporsional.');
    else {
      const kosong = POS_PUSAT.filter(ps=>!ps.pelengkap && !this.pusatPos(y,ps.id));
      if(kosong.length)
        push('minor','DAT-02','Sebagian pos dana terpusat masih kosong',
          kosong.length+' pos pokok belum bernilai: '+kosong.map(x=>x.nama).join('; ')+'.',
          'Lengkapi pos tersebut agar profil keuangan pada Tabel 6 utuh dan rasio kecukupan dana terhitung wajar.');
      const tanpaKet = POS_PUSAT.filter(ps=>this.pusatPos(y,ps.id) && !String((PP.pos[ps.id]||{}).ket||'').trim());
      if(tanpaKet.length>4)
        push('observasi','DAT-03','Sebagian besar pos terpusat belum bercatatan sumber',
          tanpaKet.length+' dari '+POS_PUSAT.length+' pos bernilai tetapi belum memuat catatan asal angka.',
          'Isi kolom catatan pada laman Dana Alokasi Terpusat dengan rujukan dokumen anggaran universitas agar angka dapat ditelusuri asesor.');
      if(!String(PP.basis.sumber||'').trim())
        push('minor','DAT-04','Sumber angka anggaran universitas belum dicantumkan',
          'Dana alokasi terpusat TA '+y+' bernilai '+rp(pusTot)+', namun dokumen sumbernya belum dicantumkan pada parameter perimbangan.',
          'Cantumkan rujukan seperti DIPA atau Rencana Kerja dan Anggaran '+IDENT.ptSingkat+' TA '+y+' pada laman Dana Alokasi Terpusat, tab Dasar Perimbangan.');
      const turunan = POS_PUSAT.filter(ps=>(PP.pos[ps.id]||{}).mode==='turunan');
      if(turunan.length)
        push('observasi','DAT-05','Sebagian pos diturunkan dari anggaran universitas',
          turunan.length+' pos dihitung dari total anggaran universitas memakai dasar perimbangan, dengan nilai gabungan '+
          rp(sum(turunan.map(x=>this.pusatPos(y,x.id))))+'.',
          'Pastikan angka anggaran universitas yang dipakai bersumber dari dokumen resmi, dan tinjau ulang setiap kali dokumen tersebut direvisi.');
    }

    /* E1c. Ketertelusuran relokasi golongan pendanaan */
    const pokT=this.pokTerpusatTot(y), kel=this.paguKelolaTot(y);
    if(this.pokTotal(y)>0){
      const disesuaikan=[];
      this.T(y).pok.forEach(k=>k.sub.forEach(s=>{ if(s.kelManual) disesuaikan.push({k:k.k+'/'+s.k, n:s.n, p:num(s.p), kel:this.subKel(s)}); }));
      push('observasi','REL-01','Komposisi pagu kelola dan alokasi terpusat',
        'Dari pagu POK '+rp(this.pokTotal(y))+', sebesar '+rp(kel)+' ('+pctS(kel,this.pokTotal(y),1)+') merupakan pagu kelola fakultas dan '+
        rp(pokT)+' ('+pctS(pokT,this.pokTotal(y),1)+') digolongkan sebagai dana alokasi terpusat karena sifat belanjanya ditetapkan universitas. '+
        'Ditambah belanja di luar POK sebesar '+rp(this.pusatLuarTot(y))+', dana alokasi terpusat seluruhnya bernilai '+rp(this.pusatTot(y))+'.',
        'Pertahankan penggolongan ini secara konsisten antartahun agar tren pagu kelola dapat dibandingkan dengan wajar.');
      if(disesuaikan.length)
        push('minor','REL-02','Terdapat penyesuaian golongan pendanaan di luar ketentuan baku',
          disesuaikan.length+' sub-kegiatan digolongkan secara manual oleh pengguna, dengan nilai gabungan '+
          rp(sum(disesuaikan.map(x=>x.p)))+'. Rinciannya: '+disesuaikan.slice(0,6).map(x=>x.k+' '+x.n.slice(0,34)+' ('+x.kel+')').join('; ')+
          (disesuaikan.length>6? ' dan '+(disesuaikan.length-6)+' lainnya.' : '.'),
          'Sertakan alasan penyesuaian pada berita acara penyusunan anggaran, dan lampirkan rekap relokasi dari laman Dana Alokasi Terpusat sebagai bukti audit.');
      const dlb=[]; this.T(y).pok.forEach(k=>k.sub.forEach(s=>{ if(s.kunci) dlb.push({k:k.k+'/'+s.k, s:s}); }));
      if(dlb.length){
        const perKode={};
        dlb.forEach(x=>{ const kd=x.s.kunciKode||'KF-?'; (perKode[kd]=perKode[kd]||[]).push(x); });
        const uraian = Object.keys(perKode).map(kd=>{
          const kf=KUNCI_FAKULTAS.find(z=>z.kode===kd)||{nama:'Pengecualian',alasan:''};
          const nilai=sum(perKode[kd].map(x=>num(x.s.p)));
          return kf.nama+' ('+perKode[kd].map(x=>x.k).join(', ')+') sebesar '+rp(nilai)+' — '+kf.alasan;
        }).join(' ');
        push('observasi','REL-03','Kegiatan yang dikecualikan tetap menjadi pagu kelola fakultas',
          dlb.length+' sub-kegiatan bernilai '+rp(sum(dlb.map(x=>num(x.s.p))))+' dikunci sebagai pagu kelola sesuai ketentuan fakultas, '+
          'sehingga tidak ikut berpindah ketika penggolongan baku diterapkan ulang. Rinciannya: '+uraian,
          'Pertahankan pengecualian ini dan lampirkan dasar penetapannya pada berita acara penyusunan anggaran agar dapat ditelusuri asesor.');
        /* Sorot khusus pengecualian pada bidang penelitian, sebab pos ini paling sering dipersoalkan */
        const pnlKunci = dlb.filter(x=>this.subPos(x.s)==='b_pnl');
        if(pnlKunci.length)
          push('observasi','REL-04','Sebagian biaya penelitian bersumber dari pagu kelola fakultas',
            'Dari total biaya penelitian '+rp(this.paguBidangTotal(y).pnl)+', sebesar '+rp(sum(pnlKunci.map(x=>num(x.s.p))))+
            ' dianggarkan langsung oleh fakultas melalui POK ('+pnlKunci.map(x=>x.s.n).join('; ')+'), sedangkan sisanya '+
            rp(this.paguBidangPusat(y).pnl)+' berupa hibah yang dikelola Lembaga Penelitian dan Pengabdian kepada Masyarakat universitas.',
            'Cantumkan pemisahan sumber ini pada Laporan Evaluasi Diri agar porsi kemandirian fakultas dalam pembiayaan penelitian terbaca jelas.');
      }
    }

    /* E1d. Sub-kegiatan POK yang masih digolongkan terpusat perlu ditinjau berkala */
    (function(){
      const sisa=[]; Calc.T(y).pok.forEach(k=>k.sub.forEach(s=>{ if(Calc.subKel(s)==='terpusat') sisa.push({k:k.k+'/'+s.k, s:s}); }));
      if(!sisa.length){
        if(Calc.pokTotal(y))
          push('observasi','REL-05','Seluruh isi POK tergolong pagu kelola fakultas',
            'Tidak ada satu pun sub-kegiatan pada Petunjuk Operasional Kegiatan TA '+y+' yang digolongkan sebagai dana alokasi terpusat. '+
            'Seluruh dana terpusat sebesar '+rp(Calc.pusatLuarTot(y))+' berasal dari belanja universitas di luar POK.',
            'Pertahankan pemisahan ini agar pagu kelola fakultas terbaca utuh pada dokumen akreditasi.');
        return;
      }
      push('minor','REL-05','Sub-kegiatan POK yang masih digolongkan terpusat',
        sisa.length+' sub-kegiatan bernilai '+rp(sum(sisa.map(x=>num(x.s.p))))+' masih digolongkan sebagai dana alokasi terpusat meskipun tercantum pada Petunjuk Operasional Kegiatan, yaitu: '+
        sisa.map(x=>x.k+' '+x.s.n+' ('+rp(x.s.p)+')').join('; ')+'. '+
        'Penggolongan ini mengurangi angka pagu kelola fakultas yang dilaporkan.',
        'Tinjau apakah kegiatan tersebut memang diarahkan universitas. Bila pelaksanaannya sepenuhnya menjadi kewenangan fakultas, pindahkan ke kolom Pagu Kelola Fakultas pada laman Dana Alokasi Terpusat, tab Relokasi Pendanaan.');
    })();

    /* E2. Konteks rendahnya dana operasional pendidikan */
    if(K.fakultas.dop < num(A.dop.minim)){
      const bDsn = num((S.t6.rows.find(r=>r.id==='b_dsn')||{}).v2);
      const perDosen = bDsn / Math.max(this.totDosen(y),1);
      push('observasi','ATR-01','Komponen biaya dosen berpotensi belum diatribusikan penuh',
        'Biaya dosen pada Tabel 6 tercatat '+rp(bDsn)+' untuk '+this.totDosen(y)+' dosen tetap, atau '+rp(Math.round(perDosen))+
        ' per dosen per tahun. Nilai ini menunjukkan komponen gaji dan tunjangan yang bersumber dari rupiah murni kemungkinan besar masih tercatat pada satuan kerja pusat dan belum diatribusikan ke fakultas, sehingga dana operasional pendidikan per mahasiswa tampak jauh di bawah ambang.',
        'Susun metode atribusi biaya bersama bagian keuangan universitas: bebankan gaji dan tunjangan dosen serta tenaga kependidikan FEBI, penyusutan gedung, dan biaya utilitas secara proporsional ke fakultas, lalu perbarui Tabel 6 dengan nilai hasil atribusi tersebut.');
    }

    /* E. Keseimbangan pendapatan vs belanja */
    const pend=this.pendapatanTot(y), G=this.grandTotal(y);
    if(G>pend*1.02) push('observasi','KSB-01','Total penggunaan melampaui total pendapatan yang tercatat',
      'Total alokasi penggunaan '+rp(G)+' melampaui total pendapatan '+rp(pend)+' sebesar '+rp(G-pend)+'. Umumnya terjadi karena belanja investasi sarana dan prasarana dibiayai dari sumber pusat yang belum tercatat pada sisi pendapatan fakultas.',
      'Lengkapi sisi pendapatan dengan nilai belanja terpusat yang dinikmati fakultas agar neraca sumber dan penggunaan seimbang.');

    /* F. Proporsi terhadap kebijakan internal */
    BIDANG.forEach(b=>{
      const tgt=num(S.rasio[b.id]); if(!tgt) return;
      const akt=pct(tot[b.id], G||1);
      if(akt < tgt*0.6) push('minor','PRP-01','Proporsi anggaran di bawah kebijakan internal',
        'Bidang '+b.pendek+': proporsi aktual '+akt.toFixed(2)+'% terhadap kebijakan '+tgt+'%.',
        'Sesuaikan komposisi anggaran pada perencanaan tahun berikutnya.');
    });

    /* G. Kelengkapan tindak lanjut */
    const evalBelum = t.evaluasi.filter(e=>{ const st=this.statusEval(y,e); return st.s!=='Tercapai'; }).length;
    if(evalBelum>0 && t.rtl.length===0) push('mayor','RTL-01','Rencana tindak lanjut belum disusun',
      'Terdapat '+evalBelum+' indikator yang belum tercapai, namun belum ada rencana tindak lanjut yang tercatat.',
      'Susun rencana tindak lanjut untuk setiap indikator yang belum tercapai, lengkap dengan penanggung jawab dan tenggat waktu.');

    /* H. Realisasi belum diisi */
    if(this.pokRealisasi(y)===0 && y<=new Date().getFullYear())
      push('observasi','RLS-02','Data realisasi belum diisi',
        'Belum terdapat catatan realisasi anggaran pada TA '+y+'. Analisis daya serap dan evaluasi capaian belum dapat dilakukan secara penuh.',
        'Isi realisasi per triwulan pada modul Realisasi & Daya Serap.');

    return F;
  },
  auditRingkas(){ const f=this.audit(); return {
    total:f.length,
    mayor:f.filter(x=>x.lvl==='mayor').length,
    minor:f.filter(x=>x.lvl==='minor').length,
    obs:f.filter(x=>x.lvl==='observasi').length
  }; }
};

/* ══════════════════════════════════════════════════════════════════════════
   BAGIAN 6 — GRAFIK (SVG murni, tanpa pustaka luar)
   ══════════════════════════════════════════════════════════════════════════ */
const Chart = {
  donut(data, opt){
    opt = opt||{}; const W=opt.w||220, R=W/2, r=opt.r||W*0.31, cx=R, cy=R;
    const tot = sum(data.map(d=>d.v)) || 1;
    let a0=-Math.PI/2, paths='';
    data.forEach(d=>{
      const frac = num(d.v)/tot; if(frac<=0) return;
      const a1 = a0 + frac*Math.PI*2;
      const big = (a1-a0) > Math.PI ? 1 : 0;
      if(frac >= 0.9999){
        paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+((R-2+r)/2)+'" fill="none" stroke="'+d.c+'" stroke-width="'+(R-2-r)+'"/>';
      } else {
        const x0=cx+Math.cos(a0)*(R-2), y0=cy+Math.sin(a0)*(R-2), x1=cx+Math.cos(a1)*(R-2), y1=cy+Math.sin(a1)*(R-2);
        const xi1=cx+Math.cos(a1)*r, yi1=cy+Math.sin(a1)*r, xi0=cx+Math.cos(a0)*r, yi0=cy+Math.sin(a0)*r;
        paths += '<path d="M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+(R-2)+' '+(R-2)+' 0 '+big+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+
                 ' L'+xi1.toFixed(2)+' '+yi1.toFixed(2)+' A'+r+' '+r+' 0 '+big+' 0 '+xi0.toFixed(2)+' '+yi0.toFixed(2)+' Z" fill="'+d.c+'">'+
                 '<title>'+esc(d.l)+': '+rp(d.v)+' ('+pctS(d.v,tot)+')</title></path>';
      }
      a0=a1;
    });
    const mid = opt.center ? '<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="'+(opt.cSize||16)+'" font-weight="700" fill="#0D2622">'+esc(opt.center)+'</text>'+
      (opt.centerSub? '<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="10" fill="#5F726D">'+esc(opt.centerSub)+'</text>':'') : '';
    return '<svg viewBox="0 0 '+W+' '+W+'" width="'+W+'" height="'+W+'" role="img">'+paths+mid+'</svg>';
  },

  barH(data, opt){
    opt=opt||{}; const W=opt.w||640, rowH=opt.rowH||30, labW=opt.labW||168, valW=opt.valW||128;
    const H = data.length*rowH + 8;
    const max = Math.max.apply(null, data.map(d=>num(d.v)).concat([1]));
    const bw = Math.max(W-labW-valW-16, 40);
    let g='';
    data.forEach((d,i)=>{
      const y=i*rowH+6, w=Math.max(num(d.v)/max*bw, num(d.v)>0?2:0);
      g += '<text x="0" y="'+(y+13)+'" font-size="11.6" fill="#12211E" font-family="Plus Jakarta Sans,sans-serif">'+esc(String(d.l).slice(0,30))+'</text>';
      g += '<rect x="'+labW+'" y="'+(y+3)+'" width="'+bw+'" height="12" rx="6" fill="#EDF2F0"/>';
      g += '<rect x="'+labW+'" y="'+(y+3)+'" width="'+w.toFixed(1)+'" height="12" rx="6" fill="'+(d.c||'#17554A')+'"><title>'+esc(d.l)+': '+rp(d.v)+'</title></rect>';
      g += '<text x="'+W+'" y="'+(y+13)+'" text-anchor="end" font-size="11.3" font-family="JetBrains Mono,monospace" font-weight="600" fill="#12211E">'+(opt.fmt? opt.fmt(d.v) : fmt(d.v))+'</text>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="xMinYMin meet" role="img">'+g+'</svg>';
  },

  barGroup(cats, series, opt){
    opt=opt||{}; const W=opt.w||660, H=opt.h||240, pl=64, pr=12, pt=14, pb=40;
    const iw=W-pl-pr, ih=H-pt-pb;
    let max=1; cats.forEach((c,i)=> series.forEach(s=> max=Math.max(max, num(s.v[i])) ));
    const ticks=4; let g='';
    for(let i=0;i<=ticks;i++){ const y=pt+ih-ih*i/ticks, val=max*i/ticks;
      g+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="#E8EEEC" stroke-width="1"/>';
      g+='<text x="'+(pl-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9.6" font-family="JetBrains Mono,monospace" fill="#8a9995">'+(val>=1e9?(val/1e9).toFixed(1)+'M':val>=1e6?(val/1e6).toFixed(0)+'jt':fmt(val))+'</text>'; }
    const cw=iw/cats.length, bw=Math.min((cw-12)/series.length, 38);
    cats.forEach((c,i)=>{
      const x0=pl+cw*i+(cw-bw*series.length)/2;
      series.forEach((s,j)=>{
        const v=num(s.v[i]), h=Math.max(v/max*ih,v>0?1.5:0), x=x0+bw*j, y=pt+ih-h;
        g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-3).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+s.c+'"><title>'+esc(c)+' — '+esc(s.l)+': '+rp(v)+'</title></rect>';
      });
      g+='<text x="'+(pl+cw*i+cw/2).toFixed(1)+'" y="'+(pt+ih+15)+'" text-anchor="middle" font-size="10.2" font-family="Plus Jakarta Sans,sans-serif" fill="#5F726D">'+esc(String(c).slice(0,16))+'</text>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="xMidYMin meet" role="img">'+g+'</svg>';
  },

  line(cats, series, opt){
    opt=opt||{}; const W=opt.w||660, H=opt.h||220, pl=60, pr=14, pt=12, pb=32;
    const iw=W-pl-pr, ih=H-pt-pb;
    let max=1; series.forEach(s=>s.v.forEach(v=>max=Math.max(max,num(v))));
    let g='';
    for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4;
      g+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="#E8EEEC"/>';
      g+='<text x="'+(pl-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9.6" font-family="JetBrains Mono,monospace" fill="#8a9995">'+(max*i/4>=1e6?((max*i/4)/1e6).toFixed(0)+'jt':fmt(max*i/4))+'</text>'; }
    const px = i => pl + (cats.length>1 ? iw*i/(cats.length-1) : iw/2);
    cats.forEach((c,i)=> g+='<text x="'+px(i).toFixed(1)+'" y="'+(pt+ih+16)+'" text-anchor="middle" font-size="10.2" fill="#5F726D" font-family="Plus Jakarta Sans,sans-serif">'+esc(c)+'</text>');
    series.forEach(s=>{
      let d='', pts='';
      s.v.forEach((v,i)=>{ const x=px(i), y=pt+ih-num(v)/max*ih; d+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
        pts+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.6" fill="#fff" stroke="'+s.c+'" stroke-width="2.2"><title>'+esc(cats[i])+' — '+esc(s.l)+': '+rp(v)+'</title></circle>'; });
      g+='<path d="'+d+'" fill="none" stroke="'+s.c+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+pts;
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="xMidYMin meet" role="img">'+g+'</svg>';
  },

  /* Signature: Pita Anggaran — alur Sumber → Bidang → Program Studi */
  sankey(y){
    const W=980, H=340, pad=26, colW=126;
    const src=Calc.pendapatanPerSumber(y), bid=Calc.paguBidangTotal(y), M=Calc.matriks(y);
    const G=Calc.grandTotal(y)||1;
    const L=[
      SUMBER.map(s=>({id:s.id,l:s.pendek,v:num(src[s.id]?src[s.id].pagu:0),c:s.warna})).filter(n=>n.v>0),
      BIDANG.map(b=>({id:b.id,l:b.pendek,v:num(bid[b.id]),c:b.warna})).filter(n=>n.v>0),
      PRODI.map(p=>({id:p.id,l:p.singkat,v:sum(BIDANG.map(b=>M[b.id][p.id])),c:p.warna})).filter(n=>n.v>0)
    ];
    const xs=[pad, W/2-colW/2, W-pad-colW];
    const gapY=7;
    const layout = L.map((col,ci)=>{
      const tot=sum(col.map(n=>n.v))||1, avail=H-pad*2-gapY*(col.length-1);
      let yy=pad;
      return col.map(n=>{ const h=Math.max(n.v/tot*avail, 9); const o={...n, x:xs[ci], y:yy, h:h, w:colW}; yy+=h+gapY; return o; });
    });
    let g='', links='';
    /* aliran 0→1 : proporsional (setiap sumber menyebar ke tiap bidang menurut porsinya) */
    const flow=(A,B,sat)=>{
      const totA=sum(A.map(n=>n.v))||1, totB=sum(B.map(n=>n.v))||1;
      const oA=A.map(n=>({n,cur:n.y})), oB=B.map(n=>({n,cur:n.y}));
      let out='';
      oA.forEach(a=> oB.forEach(b=>{
        const v = a.n.v * (b.n.v/totB);
        const ha = v/totA*(sum(A.map(n=>n.h))), hb = v/totB*b.n.h;
        const y0=a.cur, y1=a.cur+ha, z0=b.cur, z1=b.cur+hb;
        a.cur+=ha; b.cur+=hb;
        const x0=a.n.x+a.n.w, x1=b.n.x, mx=(x0+x1)/2;
        out += '<path d="M'+x0+' '+y0.toFixed(1)+' C'+mx+' '+y0.toFixed(1)+' '+mx+' '+z0.toFixed(1)+' '+x1+' '+z0.toFixed(1)+
               ' L'+x1+' '+z1.toFixed(1)+' C'+mx+' '+z1.toFixed(1)+' '+mx+' '+y1.toFixed(1)+' '+x0+' '+y1.toFixed(1)+' Z" fill="'+b.n.c+'" opacity=".26"><title>'+esc(a.n.l)+' → '+esc(b.n.l)+': '+rp(v)+'</title></path>';
      }));
      return out;
    };
    links += flow(layout[0], layout[1]);
    /* aliran 1→2 : menurut matriks distribusi nyata */
    (function(){
      const A=layout[1], B=layout[2];
      const oA=A.map(n=>({n,cur:n.y})), oB=B.map(n=>({n,cur:n.y}));
      oA.forEach(a=> oB.forEach(b=>{
        const v=num(M[a.n.id][b.n.id]); if(v<=0) return;
        const ha=v/Math.max(a.n.v,1)*a.n.h, hb=v/Math.max(b.n.v,1)*b.n.h;
        const y0=a.cur, y1=a.cur+ha, z0=b.cur, z1=b.cur+hb; a.cur+=ha; b.cur+=hb;
        const x0=a.n.x+a.n.w, x1=b.n.x, mx=(x0+x1)/2;
        links += '<path d="M'+x0+' '+y0.toFixed(1)+' C'+mx+' '+y0.toFixed(1)+' '+mx+' '+z0.toFixed(1)+' '+x1+' '+z0.toFixed(1)+
                 ' L'+x1+' '+z1.toFixed(1)+' C'+mx+' '+z1.toFixed(1)+' '+mx+' '+y1.toFixed(1)+' '+x0+' '+y1.toFixed(1)+' Z" fill="'+a.n.c+'" opacity=".3"><title>'+esc(a.n.l)+' → '+esc(b.n.l)+': '+rp(v)+'</title></path>';
      }));
    })();
    layout.forEach((col,ci)=> col.forEach(n=>{
      g += '<rect x="'+n.x+'" y="'+n.y.toFixed(1)+'" width="'+n.w+'" height="'+n.h.toFixed(1)+'" rx="4" fill="'+n.c+'" opacity=".92"/>';
      if(n.h>15){
        g += '<text x="'+(n.x+7)+'" y="'+(n.y+13).toFixed(1)+'" font-size="10.6" font-weight="700" fill="#fff" font-family="Plus Jakarta Sans,sans-serif">'+esc(n.l)+'</text>';
        if(n.h>29) g += '<text x="'+(n.x+7)+'" y="'+(n.y+25).toFixed(1)+'" font-size="9.4" fill="#ffffffcc" font-family="JetBrains Mono,monospace">'+jt(n.v,1)+' jt · '+pct(n.v,G,1)+'%</text>';
      }
    }));
    const hdr = ['SUMBER DANA','BIDANG ALOKASI','PROGRAM STUDI'].map((t,i)=>
      '<text x="'+(xs[i]+colW/2)+'" y="14" text-anchor="middle" font-size="9" font-weight="800" letter-spacing="1.4" fill="#7FA79C" font-family="Plus Jakarta Sans,sans-serif">'+t+'</text>').join('');
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">'+hdr+links+g+'</svg>';
  },

  gauge(v, max, label, color){
    const W=132,H=84,cx=W/2,cy=68,r=52;
    const f=clamp(num(v)/Math.max(num(max),1e-9),0,1);
    const a=Math.PI*(1-f), x=cx+Math.cos(a)*r, yy=cy-Math.sin(a)*r;
    return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img">'+
      '<path d="M'+(cx-r)+' '+cy+' A'+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="#E6EDEA" stroke-width="11" stroke-linecap="round"/>'+
      '<path d="M'+(cx-r)+' '+cy+' A'+r+' '+r+' 0 '+(f>0.5?1:0)+' 1 '+x.toFixed(2)+' '+yy.toFixed(2)+'" fill="none" stroke="'+(color||'#2C8A6E')+'" stroke-width="11" stroke-linecap="round"/>'+
      '<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="19" font-weight="700" font-family="JetBrains Mono,monospace" fill="#0D2622">'+esc(label)+'</text></svg>';
  }
};

let SAVE_T=null;
const Data = {
  async load(){
    try{
      const dok = await Lokal.muat(KEY);
      if(dok && dok.data && dok.data.tahun){ S = this.migrate(dok.data); Sync.rev = num(dok.rev); return true; }
    }catch(e){ console.warn('Muat data gagal:',e); }
    return false;
  },
  migrate(d){
    const base = stateAwal();
    if(!d || typeof d!=='object' || Array.isArray(d)) d = {};
    if(!d.tahun || typeof d.tahun!=='object' || Array.isArray(d.tahun) || !Object.keys(d.tahun).length)
      d.tahun = base.tahun;
    d.ident   = Object.assign({}, base.ident, d.ident||{});
    d.ambang  = Object.assign({}, base.ambang, d.ambang||{});
    d.rasio   = Object.assign({}, base.rasio, d.rasio||{});
    d.t6      = Object.assign({}, base.t6, d.t6||{});
    if(!Array.isArray(d.t6.rows) || !d.t6.rows.length) d.t6.rows = base.t6.rows;
    /* Tabel 6: kunci baru untuk tiga kolom tahun dan kolom program studi */
    if(!num(d.t6.y2)) d.t6.y2 = base.t6.y2;
    if(!num(d.t6.y1)) d.t6.y1 = num(d.t6.y2)-1;
    if(!num(d.t6.y0)) d.t6.y0 = num(d.t6.y1)-1;
    if(!PRODI_MAP[d.t6.psAkr]) d.t6.psAkr = base.t6.psAkr;
    if(d.t6.satuan!=='rupiah' && d.t6.satuan!=='juta') d.t6.satuan = base.t6.satuan;
    ['w','man','mode','catatan'].forEach(k=>{ if(!d.t6[k] || typeof d.t6[k]!=='object' || Array.isArray(d.t6[k])) d.t6[k]={}; });
    d.t6.rows.forEach(r=>{ ['v0','v1','v2'].forEach(f=>{ r[f]=Math.max(0,num(r[f])); }); });
    if(!d.t6.asli || typeof d.t6.asli!=='object') d.t6.asli = base.t6.asli;
    if(!d.t6.asli.rata || typeof d.t6.asli.rata!=='object') d.t6.asli.rata = base.t6.asli.rata;
    if(d.laporan && (typeof d.laporan!=='object' || Array.isArray(d.laporan))) delete d.laporan;
    /* Pengguna dan jejak aktivitas */
    if(!Array.isArray(d.pengguna)) d.pengguna=[];
    d.pengguna = d.pengguna.filter(u=>u && typeof u==='object' && u.id && u.user && u.sidik && u.garam)
      .map(u=>({id:String(u.id), nama:String(u.nama||u.user), user:String(u.user),
        peran:(PERAN[u.peran]?u.peran:'operator'), garam:String(u.garam), sidik:String(u.sidik),
        aktif:u.aktif!==false, baku:!!u.baku, dibuat:String(u.dibuat||''), masuk:String(u.masuk||''),
        jabatan:String(u.jabatan||''), surel:String(u.surel||'')}));
    /* Nama pengguna kembar disingkirkan agar tidak ada dua akun beridentitas sama */
    (function(){ const lihat={}; d.pengguna=d.pengguna.filter(u=>{
      const k=u.user.toLowerCase(); if(lihat[k]) return false; lihat[k]=1; return true; }); })();
    if(!d.pengguna.length) d.pengguna=[Auth.bakuAdmin()];
    if(!d.pengguna.some(u=>u.peran==='admin' && u.aktif!==false)) d.pengguna[0].peran='admin', d.pengguna[0].aktif=true;
    if(!Array.isArray(d.jejak)) d.jejak=[];
    d.jejak = d.jejak.filter(j=>j && typeof j==='object').slice(0,200);
    Object.keys(d.tahun).forEach(y=>{
      if(!/^\d{4}$/.test(String(y)) || !d.tahun[y] || typeof d.tahun[y]!=='object'){ delete d.tahun[y]; return; }
      const t=d.tahun[y], k=tahunKosong(+y);
      d.tahun[y] = Object.assign({}, k, t);
      d.tahun[y].profil = Object.assign({}, k.profil, t.profil||{});
      d.tahun[y].profil.mhs = Object.assign({}, k.profil.mhs, (t.profil||{}).mhs||{});
      d.tahun[y].profil.dosen = Object.assign({}, k.profil.dosen, (t.profil||{}).dosen||{});
      /* Dana terpusat: naikkan struktur lama tingkat bidang menjadi tingkat pos */
      const sd = seedPusat(+y);
      const P = (t.pusat && typeof t.pusat==='object' && !Array.isArray(t.pusat)) ? t.pusat : null;
      d.tahun[y].pusat = {basis: Object.assign(basisPusatAwal(), (P&&P.basis)||{}), pos:{}};
      POS_PUSAT.forEach(ps=>{
        const lama = P && P.pos && P.pos[ps.id];
        d.tahun[y].pusat.pos[ps.id] = lama && typeof lama==='object'
          ? {v:Math.max(0,num(lama.v)), mode:(lama.mode==='turunan'?'turunan':'manual'),
             univ:Math.max(0,num(lama.univ)), dasar:(DASAR_PUSAT.some(x=>x.id===lama.dasar)?lama.dasar:ps.dasar),
             ket:String(lama.ket||'')}
          : clone(sd.pos[ps.id]);
      });
      if(!P && t.eksternal && typeof t.eksternal==='object'){
        /* Nilai lama per bidang dibagikan ke pos anggotanya menurut perbandingan nilai awal */
        BIDANG.forEach(b=>{
          const nilai=num(t.eksternal[b.id]); if(!nilai) return;
          const angg=POS_PUSAT.filter(x=>x.bid===b.id); if(!angg.length) return;
          const acuan=angg.map(x=>num(sd.pos[x.id].v)), jml=sum(acuan);
          let sisa=nilai;
          angg.forEach((x,i)=>{ const v = (i===angg.length-1) ? sisa
            : Math.round(jml>0 ? nilai*acuan[i]/jml : nilai/angg.length);
            d.tahun[y].pusat.pos[x.id].v = v; sisa-=v; });
        });
      }
      delete d.tahun[y].eksternal;
      d.tahun[y].distribusi = Object.assign({basis:{},manual:{}}, t.distribusi||{});
      if(typeof d.tahun[y].distribusi.basis!=='object'||!d.tahun[y].distribusi.basis) d.tahun[y].distribusi.basis={};
      if(typeof d.tahun[y].distribusi.manual!=='object'||!d.tahun[y].distribusi.manual) d.tahun[y].distribusi.manual={};
      ['pendapatan','pok','evaluasi','rtl','temuan'].forEach(f=>{ if(!Array.isArray(d.tahun[y][f])) d.tahun[y][f]=[]; });
      if(d.tahun[y].impor && (typeof d.tahun[y].impor!=='object' || Array.isArray(d.tahun[y].impor))) delete d.tahun[y].impor;
      d.tahun[y].pok = d.tahun[y].pok.filter(kk=>kk && typeof kk==='object');
      lengkapiGolongan(d.tahun[y].pok);
      d.tahun[y].pok.forEach(kk=>{ if(!Array.isArray(kk.sub)) kk.sub=[];
        kk.sub = kk.sub.filter(s=>s && typeof s==='object');
        kk.sub.forEach(s=>{ if(!BID_MAP[s.bid]) s.bid='tkl'; if(!s.sas) s.sas='mix';
          if(!Array.isArray(s.ak)) s.ak=[];
          s.ak = s.ak.filter(a=>a && typeof a==='object');
          s.ak.forEach(a=>{ if(!Array.isArray(a.it)) a.it=[]; a.p=num(a.p); }); });
        kk.sub.forEach(s=>{ if(!Array.isArray(s.rz)||s.rz.length!==4) s.rz=[0,0,0,0]; if(!Array.isArray(s.akun)) s.akun=[]; }); });
    });
    if(!Object.keys(d.tahun).length) d.tahun = base.tahun;
    if(!d.tahun[d.ta]) d.ta = +Object.keys(d.tahun).sort()[Object.keys(d.tahun).length-1];
    return d;
  },
  save(now){
    if(Auth.siap && Auth.kini && !Auth.boleh('ubah') && !Auth.boleh('pengguna')){
      UI.toast('Peran Anda tidak berwenang mengubah data','warn'); return;
    }
    clearTimeout(SAVE_T); UI.save('busy');
    const go = async ()=>{
      try{
        Sync.rev = num(Sync.rev)+1;

  },
  exportJSON(){
    const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
    dl(blob, 'SIMAKU-FEBI-cadangan-'+new Date().toISOString().slice(0,10)+'.json');

  },
  importJSON(file){
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const d=JSON.parse(rd.result);
      if(!d || !d.tahun) throw new Error('Struktur berkas tidak dikenali');
      S = this.migrate(d); this.save(true); App.render();
      UI.toast('Data berhasil dipulihkan');
    }catch(e){ UI.toast('Berkas tidak dapat dibaca: '+e.message,'err'); } };
    rd.onerror=()=>UI.toast('Gagal membaca berkas','err');
    rd.readAsText(file);
  },
  reset(){ S = stateAwal(); this.save(true); App.render(); UI.toast('Data dikembalikan ke kondisi awal','warn'); }
};

function dl(blob, name){
  try{
    const u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 1200);
  }catch(e){ UI.toast('Unduhan gagal: '+e.message,'err'); }
}

/* ── Penyunting nilai in-place ── */
function setPath(obj, path, val){
  const p=path.split('.'); let o=obj;
  for(let i=0;i<p.length-1;i++){ if(o[p[i]]==null) o[p[i]]={}; o=o[p[i]]; }
  o[p[p.length-1]]=val;
}
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }

window.ED = {
  /* Menyunting nilai numerik pada state tahun berjalan */
  ty(path, el, refresh){
    const v = num(el.value); setPath(Calc.T(), path, v);
    el.value = fmt(v); Data.save(); if(refresh!==false) App.render();
  },
  tyRaw(path, el, refresh){
    setPath(Calc.T(), path, el.value); Data.save(); if(refresh) App.render();
  },
  root(path, el, isNum, refresh){
    setPath(S, path, isNum? num(el.value) : el.value); Data.save(); if(refresh!==false) App.render();
  },
  /* Baris array */
  arr(coll, id, field, el, isNum){
    const a = Calc.T()[coll]; const r = a.find(x=>x.id===id); if(!r) return;
    r[field] = isNum? num(el.value) : el.value;
    if(isNum) el.value = fmt(r[field]);
    Data.save(); App.render();
  }
};

const kpi = (lbl,val,sub,acc,small)=>
  '<div class="kpi" style="--acc:'+(acc||'#17554A')+'"><div class="lbl">'+esc(lbl)+'</div>'+
  '<div class="val">'+val+(small?' <small>'+esc(small)+'</small>':'')+'</div>'+
  '<div class="sub">'+(sub||'')+'</div></div>';
const card = (title,sub,body,tools,flush)=>
  '<div class="card"><div class="card-h"><div><h3>'+esc(title)+'</h3>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="sp"></div>'+(tools||'')+'</div>'+
  '<div class="card-b'+(flush?' flush':'')+'">'+body+'</div></div>';
const notice = (kind,title,body)=>
  '<div class="alert a-'+kind+'">'+svgIc(kind==='e'?'alert':kind==='w'?'alert':kind==='s'?'ok':'info','',17)+
  '<div>'+(title?'<b>'+esc(title)+'</b>':'')+body+'</div></div>';
const legend = arr => '<div class="lg">'+arr.map(a=>'<span><i style="background:'+a.c+'"></i>'+esc(a.l)+'</span>').join('')+'</div>';
const meter = (a,b,color)=>{ const p=pct(a,b); return '<div class="meter"><div class="bar"><i style="width:'+clamp(p,0,100)+'%;background:'+(color||(p>=95?'#2C8A6E':p>=75?'#A87C1F':'#AF3F36'))+'"></i></div><span class="pct">'+p.toFixed(1)+'%</span></div>'; };

App.open = {};
Pages.pok = function(){
  const y=S.ta, t=Calc.T(y), tot=Calc.pokTotal(y), real=Calc.pokRealisasi(y);
  const q = (App.tab.pokQ||'').toLowerCase();
  const bidOpt = (cur,kk,sk)=> '<select class="inp sm" style="width:132px" onchange="Pages.setBidang(\''+kk+'\',\''+sk+'\',this.value)">'+
    BIDANG.map(b=>'<option value="'+b.id+'"'+(b.id===cur?' selected':'')+'>'+esc(b.pendek)+'</option>').join('')+'</select>';

  let rows='';
  if(!t.pok.length){
    rows = '<tr><td colspan="7" class="empty">'+svgIc('list','',38)+'<div>Belum ada rincian POK untuk TA '+y+'.</div>'+
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:11px">'+
      '<button class="btn btn-s btn-p" onclick="Impor.buka()">'+svgIc('down','',13)+'Impor dari berkas POK</button>'+
      '<button class="btn btn-s" onclick="Pages.salinPOK()">Salin struktur POK dari tahun lain</button></div></td></tr>';
  }
  t.pok.forEach(k=>{
    if(App.open['k'+k.k]===undefined) App.open['k'+k.k]=true;
    const kOpen = App.open['k'+k.k]===true;
    const kReal = sum(k.sub.map(s=>sum(s.rz||[])));
    const hit = !q || (k.k+' '+k.n).toLowerCase().indexOf(q)>=0;
    const subHit = k.sub.filter(s=> !q || (k.k+'.'+s.k+' '+s.n).toLowerCase().indexOf(q)>=0 ||
      s.ak.some(a=>(a.k+' '+a.n).toLowerCase().indexOf(q)>=0 || a.it.some(i=>i.u.toLowerCase().indexOf(q)>=0)));
    if(q && !hit && !subHit.length) return;
    rows += '<tr class="tree-row lvl-1"><td class="ind-1"><button class="tree-tog'+(kOpen?' open':'')+'" onclick="Pages.tog(\'k'+k.k+'\')">'+svgIc('chev','',11)+'</button>'+
      '<span class="kode">'+esc(k.k)+'</span></td>'+
      '<td colspan="2">'+esc(k.n)+'</td>'+
      '<td class="r num">'+fmt(k.p)+'</td><td class="r num">'+fmt(kReal)+'</td><td>'+meter(kReal,k.p)+'</td>'+
      '<td class="r num">'+pctS(k.p,tot||1,1)+'</td></tr>';
    if(!kOpen && !q) return;
    (q? subHit : k.sub).forEach(s=>{
      const sKey='s'+k.k+s.k, sOpen=App.open[sKey]===true;
      const sReal=sum(s.rz||[]);
      rows += '<tr class="tree-row lvl-2"><td class="ind-2"><button class="tree-tog'+(sOpen?' open':'')+'" onclick="Pages.tog(\''+sKey+'\')">'+svgIc('chev','',11)+'</button>'+
        '<span class="kode">'+esc(k.k+'.'+s.k)+'</span></td>'+
        '<td>'+esc(s.n)+'</td><td>'+bidOpt(s.bid,k.k,s.k)+'</td>'+
        '<td class="r num">'+fmt(s.p)+'</td><td class="r num">'+fmt(sReal)+'</td><td>'+meter(sReal,s.p)+'</td>'+
        '<td class="r num">'+pctS(s.p,tot||1,2)+'</td></tr>';
      if(!sOpen) return;
      s.ak.forEach(a=>{
        const aKey='a'+k.k+s.k+a.k, aOpen=App.open[aKey]===true;
        rows += '<tr class="tree-row lvl-3"><td class="ind-3"><button class="tree-tog'+(aOpen?' open':'')+'" onclick="Pages.tog(\''+aKey+'\')">'+svgIc('chev','',11)+'</button>'+
          '<span class="kode">'+esc(a.k)+'</span></td>'+
          '<td colspan="2">'+esc(a.n)+' <span class="chip chip-n">'+esc(a.sd)+'</span></td>'+
          '<td class="r num">'+fmt(a.p)+'</td><td colspan="3"></td></tr>';
        if(!aOpen) return;
        a.it.forEach((i,ix)=>{
          rows += '<tr class="tree-row lvl-4"><td class="ind-4" style="color:var(--abu);font-size:11.5px">butir '+(ix+1)+'</td>'+
            '<td colspan="2">'+esc(i.u)+'</td>'+
            '<td class="r num" style="font-size:11.6px">'+esc(i.v)+' × '+fmt(i.h)+'</td>'+
            '<td class="r num">'+fmt(i.j)+'</td><td colspan="2"></td></tr>';
        });
      });
    });
  });

  const perAkun = (function(){ const o={};
    t.pok.forEach(k=>k.sub.forEach(s=>s.ak.forEach(a=>{ o[a.k]=o[a.k]||{n:a.n,v:0}; o[a.k].v+=num(a.p); })));
    return Object.keys(o).sort().map(k=>({k,n:o[k].n,v:o[k].v})); })();

  return `
  <div class="grid g4">
    ${kpi('Pagu POK '+esc(IDENT.singkat), rp(tot), 'Rincian Output '+esc(S.ident.ro.split('—')[0].trim()),'#17554A')}
    ${kpi('Golongan Pendanaan', rp(Calc.paguKelolaTot(y)),
        (Calc.pokTerpusatTot(y)? 'pagu kelola · '+rp(Calc.pokTerpusatTot(y))+' digolongkan terpusat'
                                : 'seluruhnya pagu kelola fakultas'),'#A87C1F')}
    ${kpi('Komponen', fmt(t.pok.length)+' <small>komponen</small>', sum(t.pok.map(k=>k.sub.length))+' sub-kegiatan','#2C8A6E')}
    ${kpi('Realisasi', rp(real), pctS(real,tot||1,1)+' daya serap · '+fmt(perAkun.length)+' akun belanja','#3A5C8C')}
  </div>

  <div class="sec-title">Struktur Petunjuk Operasional Kegiatan</div>
  ${card('Rincian Anggaran Berjenjang','Komponen → sub-kegiatan → akun belanja → butir rincian. Kolom <i>Bidang</i> menentukan pemetaan setiap sub-kegiatan ke bidang alokasi dan ikut menentukan distribusi antarprodi.',
    '<div style="padding:12px 14px;border-bottom:1px solid var(--garis-2);display:flex;gap:9px;flex-wrap:wrap;align-items:center">'+
    '<input class="inp sm" style="max-width:300px" placeholder="Cari kode, kegiatan, akun, atau butir…" value="'+esc(App.tab.pokQ||'')+'" oninput="Pages.cariPOK(this.value)">'+
    '<button class="btn btn-s" onclick="Pages.togAll(true)">Buka semua</button>'+
    '<button class="btn btn-s" onclick="Pages.togAll(false)">Tutup semua</button>'+
    '<div style="flex:1"></div>'+
    '<button class="btn btn-s" onclick="Pages.unduhPOKCsv()">'+svgIc('down','',13)+'Unduh CSV</button>'+
    '<button class="btn btn-s btn-p" onclick="Impor.buka()">'+svgIc('down','',13)+'Impor POK (.xlsx)</button></div>'+
    '<div class="tbl-wrap"><table class="t"><thead><tr><th style="min-width:150px">Kode</th><th style="min-width:280px">Uraian</th><th>Bidang</th>'+
    '<th class="r">Pagu (Rp)</th><th class="r">Realisasi (Rp)</th><th style="min-width:120px">Serapan</th><th class="r">Porsi</th></tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    (t.pok.length?'<tfoot><tr><td colspan="3">JUMLAH PAGU KELOLA FAKULTAS</td><td class="r num">'+fmt(tot)+'</td><td class="r num">'+fmt(real)+'</td><td>'+meter(real,tot)+'</td><td class="r num">100,00%</td></tr></tfoot>':'')+
    '</table></div>','',true)}

  <div class="grid g2 mt">
    ${card('Rekapitulasi menurut Akun Belanja','Klasifikasi ekonomi belanja sesuai Bagan Akun Standar',
      '<div class="tbl-wrap"><table class="t compact"><thead><tr><th>Kode Akun</th><th>Uraian</th><th class="r">Pagu</th><th class="r">Porsi</th></tr></thead><tbody>'+
      perAkun.map(a=>'<tr><td><span class="kode">'+esc(a.k)+'</span></td><td>'+esc(a.n)+'</td><td class="r num">'+fmt(a.v)+'</td><td class="r num">'+pctS(a.v,tot||1,1)+'</td></tr>').join('')+
      '</tbody><tfoot><tr><td colspan="2">JUMLAH</td><td class="r num">'+fmt(sum(perAkun.map(a=>a.v)))+'</td><td class="r num">100,00%</td></tr></tfoot></table></div>','',true)}
    ${card('Sebaran Pagu per Komponen','Nilai relatif setiap komponen terhadap pagu kelola',
      Chart.barH(t.pok.map((k,i)=>({l:k.k+' '+k.n.replace(/ \(PNBP\)/,''), v:k.p, c:['#17554A','#2C8A6E','#6C4C86','#A87C1F','#B4553C','#3A5C8C'][i%6]})),{w:600,labW:210,valW:120,rowH:32}))}
  </div>
  `;
};

  const t=Calc.T(); const k=t.pok.find(x=>x.k===kk); if(!k) return;

Pages.salinPOK = function(){
  const y=S.ta, ys=Calc.tahunTersedia().filter(x=>x!==y && Calc.T(x).pok.length);
  if(!ys.length){ UI.toast('Tidak ada tahun lain yang memiliki rincian POK','warn'); return; }
  const src=ys[ys.length-1];
  UI.confirm('Salin struktur POK','Struktur POK TA '+src+' akan disalin ke TA '+y+' dengan realisasi dikosongkan. Lanjutkan?',()=>{
    const p=clone(Calc.T(src).pok); p.forEach(k=>k.sub.forEach(s=>s.rz=[0,0,0,0]));

Pages.unduhPOKCsv = function(){
  const t=Calc.T(); const L=[['Komponen','Kode Sub','Sub Kegiatan','Bidang','Akun','Uraian Akun','Butir Rincian','Volume','Harga Satuan','Jumlah','Sumber Dana']];
  t.pok.forEach(k=>k.sub.forEach(s=>s.ak.forEach(a=>a.it.forEach(i=>
    L.push([k.k+' '+k.n, s.k, s.n, BID_MAP[s.bid].nama, a.k, a.n, i.u, i.v, i.h, i.j, a.sd]) ))));
  const csv='\uFEFF'+L.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  dl(new Blob([csv],{type:'text/csv;charset=utf-8'}), 'POK-FEBI-'+S.ta+'.csv');
  UI.toast('Rincian POK diunduh sebagai CSV');
};
