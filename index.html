Pages.pgTambah = function(){
  const r=Auth.tambah(($('#pgNama')||{}).value, ($('#pgUser')||{}).value, ($('#pgSandi')||{}).value,
    ($('#pgPeran')||{}).value, ($('#pgJab')||{}).value, ($('#pgSurel')||{}).value);
  const p=$('#pgPesan');
  if(!r.ok){ if(p) p.innerHTML=notice('e','Akun tidak dapat dibuat', esc(r.pesan)); return; }
  App.render(); UI.toast('Akun baru dibuat dan tersinkronisasi');
};
Pages.pgPeran = function(id,v){ const r=Auth.ubahPeran(id,v); if(!r.ok) UI.toast(r.pesan,'err'); App.render(); };
Pages.pgAktif = function(id,v){ const r=Auth.setAktif(id,v); if(!r.ok) UI.toast(r.pesan,'err'); App.render(); };
Pages.pgHapus = function(id){
  const u=Auth.daftar().find(x=>x.id===id); if(!u) return;
  UI.confirm('Hapus akun','Akun <b>'+esc(u.nama)+'</b> (@'+esc(u.user)+') akan dihapus permanen dari seluruh perangkat. '+
    'Jejak aktivitas yang pernah dicatat tetap tersimpan. Lanjutkan?',
    ()=>{ const r=Auth.hapus(id); UI.toast(r.ok?'Akun dihapus':r.pesan, r.ok?'warn':'err'); App.render(); }, 'Hapus akun');
};
Pages.pgEdit = function(id){
  const u=Auth.daftar().find(x=>x.id===id); if(!u){ UI.toast('Pengguna tidak ditemukan','err'); return; }
  if(!Auth.boleh('pengguna')){ UI.toast('Hanya administrator yang dapat menyunting akun','warn'); return; }
  const ini = Auth.kini && Auth.kini.id===id;
  UI.modal('Sunting Akun Pengguna',
    '<div class="pf-kepala"><span class="ub-av lg" style="background:'+((PERAN[u.peran]||{}).warna||'#17554A')+'">'+esc(Auth.inisial(u.nama))+'</span>'+
      '<div><b>'+esc(u.nama)+'</b><i>@'+esc(u.user)+' · '+esc((PERAN[u.peran]||{}).nama||'')+'</i>'+
      '<i>Dibuat '+esc(String(u.dibuat||'').slice(0,10))+(u.masuk? ' · masuk terakhir '+esc(String(u.masuk).replace('T',' ').slice(0,16)) : ' · belum pernah masuk')+'</i></div></div>'+
    '<div class="pf-bagi">Identitas</div>'+
    '<div class="grid g2" style="gap:12px">'+
      '<div class="fld"><label>Nama Lengkap</label><input class="inp" id="edNama" value="'+esc(u.nama)+'"></div>'+
      '<div class="fld"><label>Nama Pengguna</label><input class="inp" id="edUser" value="'+esc(u.user)+'"></div>'+
      '<div class="fld"><label>Jabatan</label><input class="inp" id="edJab" value="'+esc(u.jabatan||'')+'" placeholder="Bendahara Pengeluaran Pembantu"></div>'+
      '<div class="fld"><label>Surel</label><input class="inp" id="edSurel" value="'+esc(u.surel||'')+'" placeholder="nama@uinsi.ac.id"></div>'+
    '</div>'+
    '<div class="pf-bagi">Peran dan Kewenangan</div>'+
    (ini
      ? notice('i','Peran akun sendiri terkunci','Peran akun yang sedang Bapak pakai tidak dapat diubah dari sini, agar sistem tidak kehilangan administrator secara tidak sengaja. '+
          'Mintalah administrator lain melakukannya bila memang diperlukan.')+
        '<input type="hidden" id="edPeran" value="'+esc(u.peran)+'">'
      : '<div class="fld"><select class="inp" id="edPeran">'+
          Object.keys(PERAN).map(k=>'<option value="'+k+'"'+(u.peran===k?' selected':'')+'>'+esc(PERAN[k].nama)+' — '+esc(PERAN[k].ket)+'</option>').join('')+
        '</select></div>')+
    '<div class="pf-bagi">Kata Sandi <span style="font-weight:500;text-transform:none;letter-spacing:0">(kosongkan bila tidak diubah)</span></div>'+
    '<div class="fld"><input class="inp" id="edSandi" type="password" placeholder="Kata sandi baru, minimal 8 karakter dengan huruf dan angka"></div>'+
    '<div id="edPesan"></div>',
    '<button class="btn" onclick="UI.closeModal()">Batal</button>'+
    '<button class="btn btn-p" onclick="Pages.pgEditSimpan(\''+id+'\')">'+svgIc('check','',14)+'Simpan perubahan</button>', true);
};
Pages.pgEditSimpan = function(id){
  const p=$('#edPesan');
  const r=Auth.suntingAkun(id, {
    nama:($('#edNama')||{}).value, user:($('#edUser')||{}).value,
    jabatan:($('#edJab')||{}).value, surel:($('#edSurel')||{}).value,
    peran:($('#edPeran')||{}).value, sandi:($('#edSandi')||{}).value
  });
  if(!r.ok){ if(p) p.innerHTML=notice('e','Tidak dapat disimpan', esc(r.pesan)); return; }
  UI.closeModal();
  UI.penggunaBar(); App.render();
  UI.toast(r.ubah && r.ubah.length ? 'Akun diperbarui — '+r.ubah.join(', ') : 'Tidak ada perubahan yang perlu disimpan');
};
Pages.pgSandi = function(id){
  const u=Auth.daftar().find(x=>x.id===id); if(!u) return;
  UI.modal('Setel Ulang Kata Sandi',
    '<p style="margin:0 0 12px;font-size:13.2px;line-height:1.6">Kata sandi baru untuk <b>'+esc(u.nama)+'</b> (@'+esc(u.user)+'). '+
    'Sampaikan kata sandi ini kepada yang bersangkutan melalui saluran yang aman, dan mintalah agar segera menggantinya sendiri.</p>'+
    '<div class="fld"><label>Kata Sandi Baru</label><input class="inp" id="rsBaru" type="password"></div>'+
    '<div class="fld"><label>Ulangi</label><input class="inp" id="rsUlang" type="password"></div>'+
    '<div id="rsPesan"></div>',
    '<button class="btn" onclick="UI.closeModal()">Batal</button>'+
    '<button class="btn btn-p" onclick="Pages.pgSandiSimpan(\''+id+'\')">Setel ulang</button>', true);
};
Pages.pgSandiSimpan = function(id){
  const b=($('#rsBaru')||{}).value, u2=($('#rsUlang')||{}).value, p=$('#rsPesan');
  if(b!==u2){ if(p) p.innerHTML=notice('e','Tidak cocok','Kedua isian kata sandi berbeda.'); return; }
  const r=Auth.ubahSandi(id,'',b);
  if(!r.ok){ if(p) p.innerHTML=notice('e','Tidak dapat disetel', esc(r.pesan)); return; }
  UI.closeModal(); UI.toast('Kata sandi disetel ulang'); App.render();
};
Pages.pgJejakCsv = function(){
  const L=[['Waktu','Pengguna','Nama','Jenis','Uraian']];
  (S.jejak||[]).forEach(j=>L.push([String(j.w||'').replace('T',' ').slice(0,19), j.u, j.n, j.j, j.t]));
  const csv='\uFEFF'+L.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),'Jejak-Aktivitas-SIMAKU-'+new Date().toISOString().slice(0,10)+'.csv');
  UI.toast('Jejak aktivitas diunduh');
};
Pages.pgJejakHapus = function(){
  if(!Auth.jaga('hapus')) return;
  UI.confirm('Kosongkan jejak aktivitas',
    'Seluruh catatan siapa melakukan apa akan dihapus dan tidak dapat dikembalikan. Unduh terlebih dahulu bila diperlukan sebagai bukti audit. Lanjutkan?',
    ()=>{ S.jejak=[]; Auth.jejak('sistem','Mengosongkan jejak aktivitas'); Data.save(true); App.render(); UI.toast('Jejak dikosongkan','warn'); },'Kosongkan');
};

/* ══════════════════════════════════════════════════════════════════════════
   BAGIAN 11 — PENYALAAN
   ══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', e=>{
  const m=document.getElementById('ubMenu');
  if(m && m.classList.contains('on')){
    const kotak=document.getElementById('userBox');
    if(kotak && !kotak.contains(e.target)) UI.tutupUser();
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ UI.closeModal(); UI.closeNav(); UI.tutupUser(); }
});
window.addEventListener('resize', ()=>{ if(window.innerWidth>1000) UI.closeNav(); });
window.addEventListener('error', e=>{ console.error('SIMAKU:', e.message); });

(async function boot(){
  try{
    await Data.load();
    Auth.daftar();
    Report.cfg();
    Auth.siap = true;
    if(!Auth.pulihSesi()){ UI.gerbang(); }
    UI.penggunaBar();
    App.render();
    UI.save('');
    await Sync.mulai();
    if(Aktivasi.tertanam()) await Aktivasi.mulai();
    UI.sync(); UI.gerbang(); UI.penggunaBar();
    window.addEventListener('online',  ()=>{ if(Sync.cfg.mode!=='mati'&&Sync.siap()){ Sync.catat('info','Jaringan tersambung kembali'); Sync.sambung(); } });
    window.addEventListener('offline', ()=>{ Sync.setStatus('luring','Jaringan terputus; perubahan tetap tersimpan di perangkat ini'); });
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Sync.cfg.mode!=='mati' && Sync.siap() && !Sync.dialogTampil) Sync.tarik(false); });
    window.addEventListener('beforeunload', e=>{ if(Sync.kotor && Sync.cfg.mode!=='mati'){ e.preventDefault(); e.returnValue=''; } });
    const rk=Calc.auditRingkas();
    setTimeout(()=>{
      UI.toast('SIMAKU siap digunakan · TA '+S.ta);
      if(rk.mayor) setTimeout(()=>UI.toast(rk.mayor+' ketidaksesuaian mayor terdeteksi pada data','warn'), 1500);
    }, 500);
  }catch(e){
    console.error(e);
    document.getElementById('page').innerHTML =
      '<div class="alert a-e"><div><b>Sistem gagal dimuat</b>'+esc(e.message)+'</div></div>';
  }
})();
</script>
